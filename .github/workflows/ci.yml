# Fix 10 / Fix 12 — lint and tests on every pull request and push to main.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests with coverage report (report only — no minimum yet)
        run: npm run test:coverage
  ui-shard:
    name: UI shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and system packages
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system packages (Chromium cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Runner cores
        run: echo "::notice title=Runner cores::$(nproc) cores"
      - run: npm run test:ui -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  # Keeps the required check name "UI tests" (Fix 38): passes only if every shard passed.
  ui:
    name: UI tests
    runs-on: ubuntu-latest
    needs: ui-shard
    if: always()
    steps:
      - name: All UI shards passed
        run: test "${{ needs.ui-shard.result }}" = "success"
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.32.1
      # npx re-downloads and installs firebase-tools (~37 s cold, ~2 s with this cache; Fix 38).
      # A dev dependency was measured instead: it adds ~10 s to `npm ci` in every job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-firebase-tools-15.32.1
      - run: npm ci
      - run: npm run test:api
